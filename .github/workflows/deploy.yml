name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MY_DO_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 146.190.100.116 >> ~/.ssh/known_hosts
          scp scripts/remote-deploy.sh root@146.190.100.116:/tmp/order4u-deploy.sh
          ssh root@146.190.100.116 "bash /tmp/order4u-deploy.sh"
