name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MY_DO_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan 146.190.100.116 >> ~/.ssh/known_hosts
          ssh root@146.190.100.116 'bash -s' << 'REMOTE'
          set -euo pipefail
          if [ -s "$HOME/.nvm/nvm.sh" ]; then
            . "$HOME/.nvm/nvm.sh"
          fi
          if ! command -v npm >/dev/null 2>&1; then
            # Non-interactive SSH skips the login shell, where Node is installed.
            eval "$(bash -ic 'printf "PATH=%q\n" "$PATH"' 2>/dev/null)" || true
          fi
          if ! command -v npm >/dev/null 2>&1; then
            echo "npm not found on the server PATH" >&2
            exit 127
          fi
          cd /root/app/order4u
          git pull origin main
          npm ci
          npx prisma generate
          npm run build
          npx prisma db push
          pm2 restart order4u
          REMOTE
